<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>stub.li — shorten a link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171B22; --bg-soft: #1D222B; --card: #EFE7D6; --card-edge: #E2D8C0;
    --ink: #23201A; --ink-muted: #6B6252; --teal: #2F9E8F; --teal-dark: #227A6F;
    --amber: #D8A13A; --parchment: #F1EAD9; --slate: #8C93A0; --danger: #C4573F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(ellipse at top, var(--bg-soft) 0%, var(--bg) 55%);
    font-family: 'Inter', sans-serif; color: var(--parchment); min-height: 100vh; padding: 40px 20px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .hero { text-align: center; margin-bottom: 28px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--teal); font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; margin-bottom: 10px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(26px, 5vw, 36px); margin: 0; line-height: 1.15; }
  .sub { color: var(--slate); font-size: 14px; margin-top: 10px; }
  .panel { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); margin-bottom: 20px; }
  label { display: block; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 11.5px; letter-spacing: 0.04em; color: var(--ink-muted); margin-bottom: 6px; text-transform: uppercase; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--card-edge); font-family: 'JetBrains Mono', monospace; font-size: 13.5px; color: var(--ink); background: #fff; }
  input::placeholder { color: var(--slate); }
  .row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  button { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px; padding: 6px 12px; border-radius: 6px; border: none; transition: transform .12s, opacity .12s; }
  button:hover { opacity: .88; transform: translateY(-1px); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .btn-primary { background: var(--teal); color: #fff; padding: 11px 20px; font-size: 13.5px; }
  .btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid rgba(35,32,26,0.4); }
  .btn-amber { background: var(--amber); color: #fff; padding: 11px 20px; font-size: 13.5px; }
  .field-error { color: var(--danger); font-size: 12.5px; margin-top: 10px; }

  .stub { position: relative; display: flex; background: var(--card); border-radius: 10px; box-shadow: 0 6px 16px rgba(0,0,0,0.28); margin-bottom: 14px; }
  .stub-code { position: relative; width: 118px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 8px; border-right: 2px dashed rgba(107,98,82,0.35); }
  .stub-code .hole { position: absolute; right: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); }
  .stub-code .hole.top { top: -8px; } .stub-code .hole.bottom { bottom: -8px; }
  .stub-code .alias { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; color: var(--ink); word-break: break-all; text-align: center; }
  .stub-code .domain { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-muted); margin-top: 6px; text-align: center; }
  .stub-body { flex: 1; padding: 14px 16px; min-width: 0; }
  .stub-body .url { font-size: 12.5px; color: var(--ink); word-break: break-all; margin-bottom: 10px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .qr-box { margin-top: 12px; display: flex; align-items: center; gap: 12px; }
  .qr-box img { border-radius: 6px; border: 1px solid var(--card-edge); }
  .qr-box p { font-size: 11.5px; color: var(--ink-muted); max-width: 150px; margin: 0; }

  .upgrade-box { text-align: center; padding: 6px 4px 4px; }
  .upgrade-box p { font-size: 13px; color: var(--ink-muted); margin: 8px 0 14px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--parchment); padding: 10px 18px; border-radius: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
  .status-pill { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--slate); margin-top: 10px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow" id="hostLabel">stub.li</div>
    <h1>Turn a long link into a stub.</h1>
    <p class="sub">Paste a URL, get a real short link instantly.</p>
  </div>

  <form class="panel" id="createForm">
    <label>Long URL</label>
    <input id="longUrlInput" placeholder="https://example.com/a/very/long/path" />
    <div class="row">
      <div>
        <label>Custom stub (optional)</label>
        <input id="aliasInput" placeholder="my-stub" />
      </div>
      <div style="display:flex; align-items:flex-end;">
        <button type="submit" class="btn-primary" id="createBtn">Cut stub</button>
      </div>
    </div>
    <div class="field-error hidden" id="formError"></div>
    <div class="status-pill hidden" id="licensePill">Unlimited stubs unlocked ✓</div>
  </form>

  <div class="panel hidden" id="upgradePanel">
    <div class="upgrade-box">
      <strong style="font-family:'Space Grotesk',sans-serif;color:var(--ink);">Free limit reached</strong>
      <p>Upgrade for unlimited stubs — pay once via GCash, Maya, or card.</p>
      <button class="btn-amber" id="upgradeBtn">Upgrade — ₱149</button>
      <div class="field-error hidden" id="upgradeError"></div>
    </div>
  </div>

  <div class="panel hidden" id="verifyingPanel">
    <div class="upgrade-box">
      <strong style="font-family:'Space Grotesk',sans-serif;color:var(--ink);">Confirming your payment…</strong>
      <p>This usually takes a few seconds.</p>
    </div>
  </div>

  <div id="listArea"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// Edit this before deploying: your deployed Worker URL from Step 2 of the README.
const API_BASE = "https://stub-li.yourname.workers.dev";

const $ = (id) => document.getElementById(id);
let myStubs = JSON.parse(localStorage.getItem("stubli_my_stubs") || "[]");
let license = localStorage.getItem("stubli_license") || "";
let openQr = null;

try { $("hostLabel").textContent = new URL(API_BASE).host; } catch {}
if (license) $("licensePill").classList.remove("hidden");

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}

function saveMyStubs() {
  localStorage.setItem("stubli_my_stubs", JSON.stringify(myStubs));
}

function render() {
  const area = $("listArea");
  if (myStubs.length === 0) { area.innerHTML = ""; return; }
  const host = (() => { try { return new URL(API_BASE).host; } catch { return ""; } })();
  area.innerHTML = myStubs.slice().reverse().map(s => {
    const shortUrl = API_BASE.replace(/\/$/, "") + "/" + s.code;
    const truncated = s.longUrl.length > 70 ? s.longUrl.slice(0, 70) + "…" : s.longUrl;
    const qrOpen = openQr === s.code;
    return `
    <div class="stub">
      <div class="stub-code">
        <div class="hole top"></div><div class="hole bottom"></div>
        <div class="alias">/${s.code}</div>
        <div class="domain">${host}</div>
      </div>
      <div class="stub-body">
        <div class="url" title="${s.longUrl}">${truncated}</div>
        <div class="actions">
          <button class="btn-primary" style="padding:6px 12px;font-size:12px;" onclick="window.open('${shortUrl}','_blank','noopener,noreferrer')">Visit</button>
          <button class="btn-ghost" onclick="copyStub('${shortUrl}')">Copy</button>
          <button class="btn-ghost" onclick="toggleQr('${s.code}')">QR</button>
        </div>
        ${qrOpen ? `<div class="qr-box"><img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(shortUrl)}" width="100" height="100" alt="QR for ${shortUrl}" /><p>Scan to open on another device.</p></div>` : ""}
      </div>
    </div>`;
  }).join("");
}

async function copyStub(shortUrl) {
  try { await navigator.clipboard.writeText(shortUrl); showToast("Copied " + shortUrl); }
  catch { showToast("Copy manually: " + shortUrl); }
}
function toggleQr(code) { openQr = openQr === code ? null : code; render(); }

async function attemptCreate(longUrl, alias) {
  const res = await fetch(API_BASE + "/api/public/links", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(license ? { "X-License-Key": license } : {}) },
    body: JSON.stringify({ longUrl, alias }),
  });
  const data = await res.json();
  if (res.status === 402) {
    const e = new Error(data.error || "Upgrade required");
    e.upgradeRequired = true;
    throw e;
  }
  if (!res.ok) throw new Error(data.error || "Could not create stub");
  return data;
}

$("createForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = $("formError");
  err.classList.add("hidden");
  $("upgradePanel").classList.add("hidden");
  const longUrl = $("longUrlInput").value.trim();
  const alias = $("aliasInput").value.trim();
  if (!longUrl) { err.textContent = "Paste a URL to shorten."; err.classList.remove("hidden"); return; }
  const normalized = /^https?:\/\//i.test(longUrl) ? longUrl : "https://" + longUrl;

  const btn = $("createBtn");
  btn.disabled = true; btn.textContent = "Cutting…";
  try {
    const created = await attemptCreate(normalized, alias);
    myStubs.push(created);
    saveMyStubs();
    $("longUrlInput").value = ""; $("aliasInput").value = "";
    render();
  } catch (ex) {
    if (ex.upgradeRequired) {
      localStorage.setItem("stubli_pending", JSON.stringify({ longUrl: normalized, alias }));
      $("upgradePanel").classList.remove("hidden");
    } else {
      err.textContent = ex.message;
      err.classList.remove("hidden");
    }
  } finally {
    btn.disabled = false; btn.textContent = "Cut stub";
  }
});

$("upgradeBtn").addEventListener("click", async () => {
  const err = $("upgradeError");
  err.classList.add("hidden");
  const btn = $("upgradeBtn");
  btn.disabled = true; btn.textContent = "Starting checkout…";
  try {
    const returnUrl = location.origin + location.pathname;
    const res = await fetch(API_BASE + "/api/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ successUrl: returnUrl + "?paid=1", cancelUrl: returnUrl }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not start checkout");
    localStorage.setItem("stubli_pending_session", data.sessionId);
    window.location.href = data.checkoutUrl;
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove("hidden");
    btn.disabled = false; btn.textContent = "Upgrade — ₱149";
  }
});

async function pollForPayment() {
  const sessionId = localStorage.getItem("stubli_pending_session");
  if (!sessionId) return;
  $("verifyingPanel").classList.remove("hidden");
  $("upgradePanel").classList.add("hidden");

  for (let i = 0; i < 20; i++) {
    const res = await fetch(API_BASE + "/api/checkout/status/" + encodeURIComponent(sessionId));
    const data = await res.json();
    if (data.status === "paid" && data.licenseKey) {
      license = data.licenseKey;
      localStorage.setItem("stubli_license", license);
      localStorage.removeItem("stubli_pending_session");
      $("verifyingPanel").classList.add("hidden");
      $("licensePill").classList.remove("hidden");
      showToast("Upgrade complete — enjoy unlimited stubs");

      const pendingRaw = localStorage.getItem("stubli_pending");
      if (pendingRaw) {
        localStorage.removeItem("stubli_pending");
        try {
          const pending = JSON.parse(pendingRaw);
          const created = await attemptCreate(pending.longUrl, pending.alias);
          myStubs.push(created);
          saveMyStubs();
          render();
        } catch {}
      }
      return;
    }
    await new Promise((r) => setTimeout(r, 2000));
  }
  $("verifyingPanel").classList.add("hidden");
  showToast("Still confirming — refresh in a moment if it doesn't update.");
}

render();
if (localStorage.getItem("stubli_pending_session")) pollForPayment();
</script>
</body>
</html>
